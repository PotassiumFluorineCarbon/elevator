<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Elevator Controls</title>
    <link rel="stylesheet" href="../CSS/style.css">
</head>

<body>

<h1>Elevator Controls</h1>

<h2>Select Direction</h2>

<button onclick="sendDirection('up')">
    Up
</button>

<button onclick="sendDirection('down')">
    Down
</button>


<h2>Select Floor</h2>

<button onclick="requestFloor(1)">
    Floor 1
</button>

<button onclick="requestFloor(2)">
    Floor 2
</button>

<button onclick="requestFloor(3)">
    Floor 3
</button>


<p id="message"></p>


<script src="../js/controls.js"></script>

</body>

</html>
