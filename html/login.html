<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login Page</title>

    <!-- HTML5 Shiv -->
    <!--[if lt IE 9]>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5shiv/3.7.3/html5shiv.min.js"></script>
    <![endif]-->

    <!-- Bootstrap -->
    <link rel="stylesheet" href="../node_modules/bootstrap/dist/css/bootstrap.min.css">

    <!-- Custom Styles -->
    <link rel="stylesheet" href="../CSS/style.css">
</head>

<body>

    <header class="bg-dark text-white py-4 mb-4">
        <div class="container text-center">
            <h1>Login Page</h1>
        </div>
    </header>

    <main class="container">

        <div class="row justify-content-center">

            <div class="col-md-6">

                <form action="../php/authenticate.php" method="post" id="login" class="p-4 border rounded shadow-sm">//php/login.php

                    <fieldset>
                        <legend>Login</legend>

                        <div class="mb-3">
                            <label class="form-label">Username:</label>
                            <input type="text" name="username" id="username" class="form-control">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Password:</label>
                            <input type="password" name="password" id="password" class="form-control" required>
                        </div>

                        <input type="submit" value="Enter" class="btn btn-primary w-100">
                        <div>
                    <p>Error Messages:</p>
                    <p id="feedback"></p>
                </div>
                    </fieldset>

                    <div class="text-center mt-3">
                        <a href="request_access.html" class="btn btn-link">Request Access</a>
                    </div>
                    
                </form>

            </div>

        </div>

    </main>

    <footer class="text-center py-3 border-top mt-4">
        <p>&copy; Eric Eigler, Dallas Knarr</p>
    </footer>
    <script src="../js/eventListeners.js"></script>
</body>
</html>
