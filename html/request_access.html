<!DOCTYPE html>
<html>
    <head>
        <title>Request Form</title>
        <link href="../CSS/style.css" type="text/css" rel="stylesheet" />
    </head>

    <body>
        <h1>Request Access</h1>
        <form action="php/req_access.php" method="post">
                <fieldset>
                <legend>Contact details</legend>
                <p><label>First Name:</label><input type="text" name="firstname"/></p>
                <p><label>Last Name:</label><input type="text" name="lastname"/></p>
                <p><label>Email:</label><input type="email" name="email"/></p>
                <p><label>Website:</label><input type="url" name="url"/></p>
                <p><label>Birth date:</label><input type="date" name="birthday"/></p>
                <label><input type="radio" name="fac_or_student" value="faculty"/> Faculty</label>
                <label><input type="radio" name="fac_or_student" value="student"/> Student</label>
                </fieldset>
            <h3> I currently.....(check all that apply)</h3>
            <label><input type="checkbox" name="involvement" value="none"/> Have no involvement in project</label><br/>
            <label><input type="checkbox" name="involvement" value="instructor"/> I instruct on the project</label><br/>
            <label><input type="checkbox" name="involvement" value="boss"/> You will respect my authority</label><br/>
            <label><input type="checkbox" name="involvement" value="investor"/> I bring the money</label><br/>
            <label><input type="checkbox" name="involvement" value="admin"/> I admin the thing</label><br/>
            <label><input type="checkbox" name="involvement" value="it"/> I handle IT</label><br/>
            <label><input type="checkbox" name="involvement" value="superboss"/> I am superboss</label>

            <h3>Do you drive a car?
            <select name="drives_car">
                <option value="no_answer" selected></option>
                <option value="yes">Yes</option>
                <option value="no">No</option>
            </select>
        </h3>

            <h3>Tell us a bit more about yourself</h3>
            <textarea placeholder="Other details..."></textarea> <br/>
            </textarea>
            <input type="submit" value="Submit Request"/>
        </form>
    </body>
</html>
