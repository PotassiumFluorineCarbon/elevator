<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Request Access</title>

    <!-- HTML5 Shiv -->
    <!--[if lt IE 9]>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5shiv/3.7.3/html5shiv.min.js"></script>
    <![endif]-->

    <!-- Bootstrap -->
    <link rel="stylesheet" href="../node_modules/bootstrap/dist/css/bootstrap.min.css">

    <!-- Custom Styles -->
    <link rel="stylesheet" href="../CSS/style.css">
</head>



<body>

    <header class="bg-dark text-white py-4 mb-4">
        <div class="container text-center">
            <h1>Request Access</h1>
        </div>
    </header>

    <main class="container">

        <form action="php/req_access.php" method="post" id="requestAccess" class="p-4 border rounded shadow-sm">

            <section class="mb-4">

                <fieldset>
                    <legend>Contact Details</legend>

                    <div class="mb-3">
                        <label class="form-label">First Name:</label>
                        <input type="text" name="firstname" class="form-control">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Last Name:</label>
                        <input type="text" name="lastname" class="form-control">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Email:</label>
                        <input type="email" name="email" class="form-control">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Website:</label>
                        <input type="url" name="url" class="form-control">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Birth Date:</label>
                        <input type="date" name="birthday" class="form-control">
                    </div>

                    <div class="mb-3">
                        <p><strong>Status:</strong></p>

                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="fac_or_student" value="faculty">
                            <label class="form-check-label">Faculty</label>
                        </div>

                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="fac_or_student" value="student">
                            <label class="form-check-label">Student</label>
                        </div>
                    </div>

                </fieldset>

            </section>

            <section class="mb-4">

                <h3>Current Involvement</h3>

                <div class="form-check">
                    <input class="form-check-input" type="checkbox" name="involvement" value="none">
                    <label class="form-check-label">Have no involvement in project</label>
                </div>

                <div class="form-check">
                    <input class="form-check-input" type="checkbox" name="involvement" value="instructor">
                    <label class="form-check-label">I instruct on the project</label>
                </div>

                <div class="form-check">
                    <input class="form-check-input" type="checkbox" name="involvement" value="boss">
                    <label class="form-check-label">You will respect my authority</label>
                </div>

                <div class="form-check">
                    <input class="form-check-input" type="checkbox" name="involvement" value="investor">
                    <label class="form-check-label">I bring the money</label>
                </div>

                <div class="form-check">
                    <input class="form-check-input" type="checkbox" name="involvement" value="admin">
                    <label class="form-check-label">I admin the thing</label>
                </div>

                <div class="form-check">
                    <input class="form-check-input" type="checkbox" name="involvement" value="it">
                    <label class="form-check-label">I handle IT</label>
                </div>

                <div class="form-check">
                    <input class="form-check-input" type="checkbox" name="involvement" value="superboss">
                    <label class="form-check-label">I am superboss</label>
                </div>

            </section>

            <section class="mb-4">

                <label class="form-label"><strong>Do you drive a car?</strong></label>
                <select name="drives_car" class="form-select mb-3">
                    <option value="no_answer" selected></option>
                    <option value="yes">Yes</option>
                    <option value="no">No</option>
                </select>

            </section>

            <section class="mb-4">

                <label class="form-label">
                    <strong>Tell us a bit more about yourself</strong>
                </label>

                <textarea
                    id="details"
                    name="details"
                    class="form-control"
                    placeholder="Other details..."
                    rows="4"
                    maxlength="180"
                ></textarea>

                <small id="charCount" class="text-muted">
                    180 characters remaining
                </small>

                <div id="errorMsg" class="text-danger"></div>

            </section>

            <div class="mb-3">
                <p class="mb-1"><strong>Form Status:</strong></p>
                <p id="feedback"></p>
            </div>

            <input type="submit" value="Submit Request" class="btn btn-success w-100">

        </form>

    </main>

    <footer class="text-center py-3 border-top mt-4">
        <p>&copy; Request Access System</p>
    </footer>

    <script>
        const textarea = document.getElementById("details");
        const charCount = document.getElementById("charCount");
        const errorMsg = document.getElementById("errorMsg");

        const maxChars = 180;

        textarea.addEventListener("input", function () {

            const currentLength = textarea.value.length;
            const remaining = maxChars - currentLength;

            charCount.textContent =
                remaining + " characters remaining";

            if (currentLength >= maxChars) {
                errorMsg.textContent =
                    "You have reached the maximum of 180 characters.";
            } else {
                errorMsg.textContent = "";
            }
        });
    </script>

    <script src="../js/eventListeners.js"></script>
</body>
</html>
